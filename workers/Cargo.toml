[package]
name = "sealwork-worker"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Hash-pinned confidential invoice agents and an independent acceptance verifier for Sealwork."

[features]
default = []
ledgerline-v1 = []
ledgerline-v2 = []
archivist-v1 = []
verifier = []

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
csv = "=1.4.0"
sha2 = "=0.10.9"
hex = "=0.4.3"
base64 = "=0.22.1"
aes-gcm = "=0.10.3"
rand = "=0.8.5"

[target.'cfg(target_os = "wasi")'.dependencies]
outlayer = { version = "=0.2.1", features = ["encryption-keys"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = "debuginfo"
panic = "abort"
debug = false

[profile.dev]
debug = false
